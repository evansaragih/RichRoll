<!DOCTYPE html>
<html>
<head>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #333; }
  .board { width: 200px; height: 200px; background: #666; transform: rotateX(60deg) rotateZ(-45deg); transform-style: preserve-3d; }
  .pin1 { position: absolute; left: 100px; top: 100px; width: 10px; height: 100px; background: red; transform-origin: bottom center; transform: rotateZ(45deg) rotateX(-60deg); }
  .pin2 { position: absolute; left: 50px; top: 50px; width: 10px; height: 100px; background: blue; transform-origin: bottom center; transform: rotateX(-60deg) rotateZ(45deg); }
</style>
</head>
<body>
  <div class="board">
    <div class="pin1"></div>
    <div class="pin2"></div>
  </div>
</body>
</html>
